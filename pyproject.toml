[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "resilient-browser-automation-python"
version = "0.1.0"
description = "Reliable browser automation with bounded retries and durable recovery."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

[project.scripts]
resilient-browser-automation = "resilient_browser_automation.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/resilient_browser_automation"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: requires Docker and the pinned Test Stand image"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
